name: Compilar WhyClock

# Con cada cambio en main se compila el APK y queda en Releases de este repositorio (privado).
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Preparar la llave de firma
        env:
          LLAVE: ${{ secrets.WHYCLOCK_LLAVE }}
        run: |
          if [ -n "$LLAVE" ]; then
            mkdir -p app/firma
            # Se quitan espacios, saltos de línea y comillas que se cuelan al pegarla
            # Al pegarla se coló texto de más: se quedan solo con el tramo largo en base64
            printf '%s' "$LLAVE" | tr -d ' \r\n\t' | grep -oE '[A-Za-z0-9+/]{500,}={0,2}' | awk '{ if (length($0) > length(m)) m = $0 } END { print m }' | base64 -d > app/firma/llave.keystore
            echo "Llave: $(stat -c %s app/firma/llave.keystore) bytes"
          fi
      - name: Capturas de pantalla de prueba
        continue-on-error: true
        run: |
          gradle --no-daemon testDebugUnitTest --tests '*CapturasTest*' || true
          for f in app/build/capturas/*.png; do echo "=== CAPTURA $(basename $f)"; base64 -w 0 "$f"; echo; echo "=== FIN"; done
      - name: Compilar APK
        run: gradle --no-daemon assembleRelease
      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk WhyClock.apk
          gh release create "v3.0.$GITHUB_RUN_NUMBER" WhyClock.apk --title "WhyClock 3.0.$GITHUB_RUN_NUMBER" --notes "$(git log -1 --pretty=%s)"
